name: RF monitor focused validation
on:
  pull_request:
    branches: [chatgpt/pr120-rf-session-guards]
    paths:
      - 'propagation.js'
      - 'propagation-ui.js'
      - 'propagation.test.cjs'
      - 'propagation.browser.test.cjs'
      - 'navigation.browser.test.cjs'
      - '.github/workflows/rf-monitor-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rf-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test propagation.test.cjs
  rf-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: node propagation.browser.test.cjs
  full-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Complete unit suite
        run: pnpm test
      - run: pnpm exec playwright install chromium
      - name: Complete browser regression suite
        run: pnpm run test:browser
