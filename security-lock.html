<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'"><title>Unlock Nightlink</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="security.css"></head><body class="security-lock"><main class="security-lock-card"><div class="security-lock-brand"><img src="icon.svg" alt="">Nightlink</div><h1>Unlock your workspace</h1><p class="security-note">Enter your password and a fresh authenticator code. A saved recovery code can replace the authenticator code.</p><form class="security-form" id="security-unlock"><label for="unlock-password">Password</label><input id="unlock-password" type="password" autocomplete="off" required maxlength="512" autofocus><label for="unlock-code">Authenticator or recovery code</label><input id="unlock-code" type="text" autocomplete="off" spellcheck="false" required maxlength="128"><div id="security-lock-error" class="security-error" role="status"></div><div class="security-actions"><button id="security-unlock-button">Unlock</button><button id="security-quit" type="button">Quit</button></div></form><p><small>Offline verification · Your phone and computer clocks must agree. Recovery codes still require your password.</small></p></main><script src="security-lock.js"></script></body></html>
